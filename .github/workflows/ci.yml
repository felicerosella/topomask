# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy --platform win32

  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.txt
      - run: pytest --cov --cov-report=term-missing
      - run: node --test tests/*.test.js

  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan full history
        run: ./gitleaks git --redact -v --config .gitleaks.toml .

  build:
    runs-on: windows-2025
    needs: [lint, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-build.txt
      - run: python -m PyInstaller --noconfirm --clean topomask.spec
      - run: python scripts/collect_licenses.py
      - name: Smoke test the bundle layout
        shell: pwsh
        run: |
          foreach ($f in 'topomask.exe', '_internal/topomask.html', 'THIRD_PARTY_LICENSES.txt', 'LICENSE') {
            if (-not (Test-Path "dist/topomask/$f")) { throw "missing dist/topomask/$f" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: topomask-windows
          path: dist/topomask/
          retention-days: 5
          if-no-files-found: error
      - name: Build installer
        shell: pwsh
        run: ./scripts/build_installer.ps1
      - name: Smoke test install
        shell: pwsh
        run: |
          $setup = (Get-ChildItem out/*-setup.exe | Select-Object -First 1).FullName
          $p = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER'
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\topomask'
          foreach ($f in 'topomask.exe', '_internal\topomask.html', '_internal\icon.png', 'unins000.exe') {
            if (-not (Test-Path (Join-Path $app $f))) { throw "missing $f after install" }
          }
          $p = Start-Process (Join-Path $app 'unins000.exe') -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($p.ExitCode -ne 0) { throw "uninstaller exited with $($p.ExitCode)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: topomask-windows-setup
          path: out/*-setup.exe
          retention-days: 5
          if-no-files-found: error
