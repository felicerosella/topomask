# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check that the tag matches __version__
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); import topomask; print(topomask.__version__)"
          if ("v$version" -ne $env:TAG) { throw "tag $env:TAG does not match __version__ $version" }
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-build.txt
      - run: python -m PyInstaller --noconfirm --clean topomask.spec
      - run: python scripts/collect_licenses.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist/topomask -DestinationPath "out/topomask-$env:TAG-win-x64.zip"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: out/*.zip
          if-no-files-found: error

  sbom:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.txt
      - run: cyclonedx-py requirements requirements.txt --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  publish:
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum -- *.zip sbom.cdx.json > SHA256SUMS.txt
      - name: Create draft release
        working-directory: out
        run: |
          gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG" \
            -- *.zip sbom.cdx.json SHA256SUMS.txt
