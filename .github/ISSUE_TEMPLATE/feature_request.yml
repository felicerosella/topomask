name: Feature request
description: Suggest a new detection or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or hard to do today?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example (documentation values only)
      description: A sample line and the output you would expect.
      render: text
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
