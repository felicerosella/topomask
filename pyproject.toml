# SPDX-License-Identifier: Apache-2.0
[project]
name = "topomask"
version = "0.2.1"
description = "Reversible, topology-preserving anonymizer for logs and configs before you paste them into an AI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "TID"]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["webview", "webview.*", "pystray", "pystray.*", "PIL", "PIL.*", "PyInstaller.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers -ra"

[tool.coverage.run]
source = ["topomask"]
branch = true
